name: Build macOS & iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      target_edition:
        description: 'Target Edition to build (hybrid, offline, online)'
        required: true
        default: 'hybrid'
        type: choice
        options:
          - hybrid
          - offline
          - online

jobs:
  # ==========================================
  # JOB 1: BUILD MACOS DESKTOP APP (.zip)
  # ==========================================
  build-macos:
    name: Build macOS Application
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter Doctor Check
        run: flutter doctor -v

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build macOS Release Bundle
        run: |
          EDITION="${{ github.event.inputs.target_edition || 'hybrid' }}"
          echo "Building macOS for edition: $EDITION"
          if [ "$EDITION" = "offline" ]; then
            flutter build macos --release -t lib/main_offline.dart
          elif [ "$EDITION" = "online" ]; then
            flutter build macos --release -t lib/main.dart
          else
            flutter build macos --release -t lib/main_hybrid.dart
          fi

      - name: Package macOS App into ZIP
        run: |
          mkdir -p output_macos
          cd build/macos/Build/Products/Release
          zip -r -y ../../../../../output_macos/SakhiBachatGat_macOS.zip *.app
          cd ../../../../../
          ls -la output_macos/

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SakhiBachatGat_macOS
          path: output_macos/SakhiBachatGat_macOS.zip
          retention-days: 14

  # ==========================================
  # JOB 2: BUILD IOS IPA PACKAGE (.ipa)
  # ==========================================
  build-ios-ipa:
    name: Build iOS IPA Package
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build iOS Application (Release, Unsigned)
        run: |
          EDITION="${{ github.event.inputs.target_edition || 'hybrid' }}"
          echo "Building iOS for edition: $EDITION"
          if [ "$EDITION" = "offline" ]; then
            flutter build ios --release --no-codesign -t lib/main_offline.dart
          elif [ "$EDITION" = "online" ]; then
            flutter build ios --release --no-codesign -t lib/main.dart
          else
            flutter build ios --release --no-codesign -t lib/main_hybrid.dart
          fi

      - name: Package Runner.app into installable .ipa
        run: |
          mkdir -p build/ios/ipa_payload/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa_payload/Payload/
          cd build/ios/ipa_payload
          zip -r -y SakhiBachatGat.ipa Payload
          mkdir -p ../../../output_ios
          mv SakhiBachatGat.ipa ../../../output_ios/
          cd ../../../
          ls -lh output_ios/

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SakhiBachatGat_iOS_IPA
          path: output_ios/SakhiBachatGat.ipa
          retention-days: 14
